<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morya Essentials – Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
    }

    .product h3 {
      margin: 10px 0 5px;
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>

  <div class="products">

    <div class="product">
      <img src="images/mandir.jpg" alt="Mandir Grade Kapoor">
      <h3>Mandir Grade Kapoor</h3>
      <p>Pooja purpose</p>
    </div>

    <div class="product">
      <img src="images/loose.jpg" alt="Loose Kapoor">
      <h3>Loose Kapoor</h3>
      <p>Economy quality</p>
    </div>

    <div class="product">
      <img src="images/premium.jpg" alt="Premium Kapoor">
      <h3>Premium Kapoor</h3>
      <p>High purity</p>
    </div>

  </div>

</body>
</html>
