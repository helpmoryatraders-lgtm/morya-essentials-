<!DOCTYPE html>
<html>
<head>
<title>Order | Morya Traders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0d0d0d;color:white;font-family:Segoe UI}
h1{text-align:center;color:#ffd700}
form{max-width:500px;margin:auto;background:#1a1a1a;padding:25px;border-radius:15px}
input,select,textarea{width:100%;margin:10px 0;padding:12px;font-size:18px}
button{width:100%;padding:14px;font-size:20px;background:#ffd700;border:none;border-radius:30px}
</style>
</head>

<body>
<h1>Place Your Order</h1>

<form action="mailto:help.moryatraders@gmail.com" method="post" enctype="text/plain">
<input name="Name" placeholder="Your Name" required>
<input name="Mobile" placeholder="Mobile Number" required>
<select name="Product">
<option>Mandir Grade Kapoor</option>
<option>Daily Puja Kapoor</option>
<option>Medical Kapoor</option>
</select>
<input name="Quantity" placeholder="Quantity (Kg)">
<textarea name="Message" placeholder="Message"></textarea>
<button type="submit">Send Order</button>
</form>
</body>
</html>
