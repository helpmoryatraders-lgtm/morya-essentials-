<!DOCTYPE html>
<html>
<head>
  <title>Order Now</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Morya Essentials</h1>
</header>

<div class="container">
  <div class="form-box">
    <h2>Mandir Grade Kapoor</h2>

    <form action="mailto:help.moryatraders@gmail.com" method="post" enctype="text/plain">
      <select name="Purity">
        <option>Select Purity</option>
        <option>100%</option>
        <option>95%</option>
        <option>90%</option>
      </select>

      <select name="Packet Size">
        <option>Select Packet Size</option>
        <option>50 gm</option>
        <option>100 gm</option>
        <option>250 gm</option>
        <option>1 kg</option>
      </select>

      <input type="number" name="Quantity" placeholder="Quantity (Packets)" required>
      <input type="text" name="Customer Name" placeholder="Customer Name" required>
      <input type="tel" name="Mobile" placeholder="Mobile Number" required>

      <button type="submit">ORDER NOW</button>
    </form>
  </div>
</div>

</body>
</html>
