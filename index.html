<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Morya Essentials</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111, #333);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .lang-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }

    .lang-box button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    .lang-box button.active {
      background: #c59d5f;
      color: black;
      font-weight: bold;
    }

    section {
      padding: 30px 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 10px;
      font-size: 22px;
      color: #111;
    }

    .card p {
      font-size: 15px;
      line-height: 1.6;
      color: #444;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .product {
      background: #fafafa;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #eee;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }
