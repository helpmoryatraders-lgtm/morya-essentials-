<style>
body{margin:0;font-family:Segoe UI;background:#0d0d0d;color:white}
header{
  height:100vh;
  position:relative;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url('https://images.unsplash.com/photo-1601884989645-bde8c58e69c4');

}
}
}
  @keyframes bgMove{

  }
  to{

    background-size:110%;
  }
  }
  }

#menu a{display:block;color:#ffd700;font-size:20px;margin:20px 0;text-decoration:none}
.hero{
  height:100%;

       }    /* 👈 neeche space */

}
.hero a{margin-top:20px;background:#ffd700;color:black;padding:14px 30px;border-radius:30px;text-decoration:none;font-size:20px}
