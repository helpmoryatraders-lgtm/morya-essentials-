<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morya Essentials – Pure By Faith</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Georgia', serif;
}

body{
  height:100vh;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url('https://images.unsplash.com/photo-1604023489281-8b7c9b9b6f57?auto=format&fit=crop&w=1200&q=80');
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d4af37;
  overflow:hidden;
}

.container{
  text-align:center;
  animation:fadeIn 2.2s ease forwards;
}

h1{
  font-size:3.2rem;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(212,175,55,0.6);
  animation:glow 3s infinite alternate;
}

.tagline{
  margin-top:12px;
  font-size:1.1rem;
  letter-spacing:3px;
  color:#e6c76b;
  opacity:0;
  animation:fadeUp 1.5s ease forwards;
  animation-delay:1s;
}

.btn{
  margin-top:35px;
  padding:14px 36px;
  background:linear-gradient(135deg,#d4af37,#b8962e);
  border:none;
  color:#000;
  font-weight:bold;
  font-size:1rem;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:3px;
  box-shadow:0 0 20px rgba(212,175,55,0.5);
  opacity:0;
  animation:fadeUp 1.5s ease forwards;
  animation-delay:1.8s;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 35px rgba(212,175,55,0.8);
}

footer{
  position:absolute;
  bottom:20px;
  font-size:0.85rem;
  color:#888;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:2.5s;
}

/* Animations */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes glow{
  from{text-shadow:0 0 10px rgba(212,175,55,0.4);}
  to{text-shadow:0 0 25px rgba(212,175,55,0.9);}
}
</style>
</head>

<body>

<div class="container">
  <h1>Morya Essentials</h1>
  <div class="tagline">PURE BY FAITH</div>
  <button class="btn" onclick="location.href='home.html'">Enter Site</button>
</div>

<footer>© 2026 Morya Essentials</footer>

</body>
</html>
