<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morya Essentials | Pure by Faith</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  background:#000;
  color:#fff;
}

/* ===== NAVBAR ===== */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 24px;
  display:flex;
  justify-content:flex-end;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);
  z-index:1000;
}

.menu{
  font-size:28px;
  cursor:pointer;
  color:#FFD700;
}

/* ===== MENU ===== */
#menuBox{
  position:fixed;
  right:-100%;
  top:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:0.4s;
  z-index:1001;
}

#menuBox a{
  color:#FFD700;
  text-decoration:none;
  font-size:26px;
  margin:14px 0;
}

/* ===== HEADER / HERO ===== */
header{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:160px 20px 80px;
  background:#000;
}

/* ===== BRAND FRAME ===== */
.brand-frame{
  padding:28px 38px;
  border:2px solid rgba(212,175,55,0.7);
  border-radius:18px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
}

.brand-frame h1{
  font-size:44px;
  letter-spacing:5px;
  color:#F5E6B0;
}

.brand-frame span{
  display:block;
  font-size:36px;
  letter-spacing:7px;
  margin-top:6px;
  color:#9FD0B8;
}

/* ===== TAGLINE ===== */
.tagline{
  margin-top:22px;
  font-size:18px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#f5f1e8;
  animation:fadeUp 1.6s ease;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:30px;
  display:inline-block;
  padding:14px 38px;
  background:#4A5D4E;
  color:#FAFAF7;
  font-size:16px;
  font-weight:600;
  letter-spacing:1px;
  border-radius:40px;
  text-decoration:none;
  transition:0.3s;
  box-shadow:0 0 18px rgba(199,199,199,0.35);
}

.btn:hover{
  background:#3F5244;
  transform:translateY(-3px);
  box-shadow:0 0 30px rgba(199,199,199,0.55);
}

/* ===== QUOTE ===== */
.faith-quote{
  margin-top:80px;
}

.divider{
  width:80px;
  height:2px;
  background:linear-gradient(to right, transparent, gold, transparent);
  margin:15px auto;
}

.quote-en{
  font-size:18px;
  line-height:1.9;
  color:#ffffff;
  max-width:700px;
  margin:0 auto;
  font-style:italic;
}

/* ===== ANIMATION ===== */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="menu" onclick="openMenu()">☰</div>
</nav>

<!-- MENU -->
<div id="menuBox" onclick="closeMenu()">
  <a href="index.html">Home</a>
  <a href="products.html">Products</a>
  <a href="trust.html">Trust & Purity</a>
  <a href="order.html">Order</a>
  <a href="contact.html">Contact</a>
</div>

<!-- HERO -->
<header>
  <div class="brand-frame">
    <h1>
      MORYA
      <span>ESSENTIALS</span>
    </h1>
  </div>

  <p class="tagline">Pure by Faith</p>

  <a href="products.html" class="btn">View Products</a>

  <div class="faith-quote">
    <div class="divider"></div>
    <p class="quote-en">
      Faith begins with purity — and purity begins with Morya Essentials.
    </p>
    <div class="divider"></div>
  </div>
</header>

<script>
function openMenu(){
  document.getElementById("menuBox").style.right="0";
}
function closeMenu(){
  document.getElementById("menuBox").style.right="-100%";
}
</script>

</body>
  </html>
