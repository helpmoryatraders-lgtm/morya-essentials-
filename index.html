<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morya Essentials | Pure by Faith</title>

<style>
/* ---------- RESET ---------- */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}

/* ---------- BODY ---------- */
body{
  background:#000;
  color:#fff;
}

/* ---------- NAVBAR ---------- */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.7);
  z-index:1000;
}

.brand{
  font-size:22px;
  font-weight:bold;
  color:#ffd700;
}

.menu{
  font-size:26px;
  cursor:pointer;
}

/* ---------- MENU ---------- */
#menuBox{
  position:fixed;
  right:-100%;
  top:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:0.4s;
  z-index:999;
}

#menuBox a{
  color:#ffd700;
  text-decoration:none;
  font-size:26px;
  margin:12px 0;
}

/* ---------- HEADER ---------- */
header{
  position:relative;
  height:100vh;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1604147706283-d7119b5b822c");
  background-size:cover;
  background-position:center;
  animation:bgZoom 20s infinite alternate;
}

/* ---------- HERO ---------- */
.hero{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding-top:70px; /* navbar fix */
}

/* ---------- TEXT ---------- */
.hero h1{
  font-size:46px;
  color:#ffd700;
  margin-bottom:10px;
  animation:fadeDown 1.4s ease;
}

.hero p{
  font-size:20px;
  letter-spacing:1px;
  margin-bottom:35px;
  animation:fadeUp 1.6s ease;
}

/* ---------- BUTTON ---------- */
.hero a{
  background:#ffd700;
  color:#000;
  padding:14px 36px;
  border-radius:40px;
  text-decoration:none;
  font-size:18px;
  font-weight:600;
  animation:fadeUp 1.9s ease;
  box-shadow:0 0 25px rgba(255,215,0,0.6);
}

.hero a:hover{
  box-shadow:0 0 45px rgba(255,215,0,0.9);
  transform:scale(1.05);
}

/* ---------- ANIMATIONS ---------- */
@keyframes fadeDown{
  from{opacity:0; transform:translateY(-30px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes bgZoom{
  from{background-size:100%;}
  to{background-size:110%;}
}
  /* ===== HERO SPACING FIX ===== */
.hero {
  text-align: center;
  padding: 150px 20px;
}

.hero h1 {
  margin-bottom: 22px;
}

.hero p {
  margin-bottom: 36px;
}

.hero a {
  margin-bottom: 55px;
  display: inline-block;
}

/* ===== QUOTE GAP ===== */
.faith-quote {
  margin-top: 80px;
}

.quote-en {
  font-size: 18px;
  line-height: 1.9;
  color: #ffffff;
  max-width: 700px;
  margin: 0 auto;
  }
  .faith-line {
  font-family: "Playfair Display", serif;
  font-size: 20px;
  font-style: italic;
  letter-spacing: 1.2px;
  line-height: 1.8;
  color: #f5c542;
  text-align: center;
  margin-top: 40px;
  text-shadow: 0 0 12px rgba(245, 197, 66, 0.45);
}

.divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(to right, transparent, gold, transparent);
  margin: 15px auto;
}
  .btn {
  display: inline-block;
  padding: 14px 38px;
  background: #4A5D4E;
  color: #FAFAF7;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  border-radius: 40px;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 0 18px rgba(199, 199, 199, 0.35);
}

.btn:hover {
  background: #3F5244;
  box-shadow: 0 0 28px rgba(199, 199, 199, 0.55);
  transform: translateY(-2px);
                         }
</style>
</head>

  <!-- 🔽 YAHAN PASTE KARNA HAI 🔽 -->
  <div class="faith-quote">

<p class="faith-line">
  Faith begins with purity — and purity begins with Morya Essentials.
</p>

<div class="divider"></div>
    
  </div>
  <!-- 🔼 YAHAN TAK 🔼 -->

    
  </div>

</body>
</html>
