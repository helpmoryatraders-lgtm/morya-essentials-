<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morya Essentials | Pure by Faith</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LANGUAGE SELECT -->
<div id="lang">
  <h1>Morya Essentials</h1>
  <p class="tag">Pure by Faith</p>
  <button onclick="enter('en')">English</button>
  <button onclick="enter('mr')">मराठी</button>
</div>

<!-- WEBSITE -->
<div id="site" style="display:none">

<header>
  <span class="logo">Morya Essentials</span>
  <span class="menu" onclick="toggle()">☰</span>
</header>

<nav id="nav">
  <a onclick="show('home')">Home</a>
  <a onclick="show('products')">Products</a>
  <a onclick="show('contact')">Contact</a>
</nav>

<section id="home" class="page">
  <h2>Camphor, Refined for Pure Devotion</h2>
  <p>Mandir Grade • 100% Pure • Kolhapur</p>
</section>

<section id="products" class="page">
  <h2>Our Products</h2>
  <div class="card">
    <h3>Loose Kapoor (100% Pure)</h3>
    <button onclick="show('order')">Order</button>
  </div>
</section>

<section id="order" class="page">
  <h2>Place Order</h2>
  <form action="mailto:help.moryaessentials@gmail.com" method="post">
    <input placeholder="Your Name" required>
    <input placeholder="Quantity" required>
    <button type="submit">Submit</button>
  </form>
</section>

<section id="contact" class="page">
  <h2>Contact</h2>
  <p>Email: help.moryaessentials@gmail.com</p>
  <p>Kolhapur, Maharashtra</p>
</section>

<footer>
  © Morya Essentials
</footer>

</div>

<script>
function enter(l){
  localStorage.lang=l;
  document.getElementById("lang").style.display="none";
  document.getElementById("site").style.display="block";
  show('home');
}
function toggle(){
  let n=document.getElementById("nav");
  n.style.display=n.style.display=="block"?"none":"block";
}
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.style.display="none");
  document.getElementById(id).style.display="block";
  document.getElementById("nav").style.display="none";
}
</script>

</body>
  </html>
