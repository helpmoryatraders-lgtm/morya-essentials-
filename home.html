<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morya Essentials – Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Georgia, serif;
  background:#000;
  color:#d4af37;
}

.hero{
  height:100vh;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.65);
}

.content{
  position:relative;
  z-index:2;
  animation:fadeUp 2s ease;
}

h1{
  font-size:2.6rem;
  text-shadow:0 0 20px rgba(212,175,55,0.7);
}

#festival{
  margin-top:10px;
  font-size:1.1rem;
  letter-spacing:2px;
}

.btn{
  margin-top:30px;
  padding:14px 34px;
  background:linear-gradient(135deg,#d4af37,#b8962e);
  border:none;
  font-weight:bold;
  cursor:pointer;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(25px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="hero" id="hero">
  <div class="overlay"></div>
  <div class="content">
    <h1>Daily Puja Essentials</h1>
    <div id="festival">PURE BY FAITH</div>
    <button class="btn" onclick="location.href='products.html'">Explore Products</button>
  </div>
</div>

<script>
const festivals = [
  {
    name: "Ganesh Chaturthi Special",
    img: "https://images.unsplash.com/photo-1602940659805-7703f57b5b96"
  },
  {
    name: "Diwali Puja Essentials",
    img: "https://images.unsplash.com/photo-1600788911194-5b7e26a2b7d6"
  },
  {
    name: "Navratri Mandir Grade Kapoor",
    img: "https://images.unsplash.com/photo-1603625954784-7e7fdd7d2a8c"
  },
  {
    name: "Daily Shiv Puja Kapoor",
    img: "https://images.unsplash.com/photo-1622455275979-06cb6e30c1c4"
  }
];

// AUTO ROTATE DAILY
const day = new Date().getDate();
const today = festivals[day % festivals.length];

document.getElementById("festival").innerText = today.name;
document.getElementById("hero").style.backgroundImage =
  `url('${today.img}?auto=format&fit=crop&w=1200&q=80')`;
</script>

</body>
</html>
